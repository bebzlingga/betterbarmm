# BetterBARMM for iOS. Generate the Xcode project with `xcodegen` in this folder; the .xcodeproj is build output.
name: BetterBARMM
options:
  bundleIdPrefix: com.betterbarmm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  BetterBARMM:
    type: application
    platform: iOS
    sources: [BetterBARMM]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betterbarmm.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BetterBARMM/Info.plist
      properties:
        CFBundleDisplayName: BetterBARMM
        NSAccentColorName: AccentColor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.betterbarmm.app.refresh]
        # The feed is HTTPS in production; this only lets a debug run read a feed served from this Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      # Until /app/v1 is live on betterbarmm.com, Run reads the feed served from this Mac (see README).
      commandLineArguments:
        "-feedBase http://localhost:8765": true
