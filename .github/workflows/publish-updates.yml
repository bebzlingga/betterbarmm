# Run by hand (Actions → Publish updates → Run workflow), or from the admin's
# "Publish approved now": write approved updates and admin edits into
# datasets/, commit to main, and let the sites redeploy.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

name: Publish updates

on:
  workflow_dispatch:

concurrency:
  group: publish-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun db:publish
      # The accident map is built from its inputs, not edited: when an editor's
      # correction or added incident was just written, build it again so the
      # commit carries the map that follows from them.
      - name: Rebuild the accident map
        run: |
          if git diff --quiet -- datasets/accidents/enrichment/admin.json datasets/accidents/reports/admin.json; then
            echo "No Incident Watch edits"
          else
            python3 -I datasets/accidents/scripts/build_accidents.py
          fi
      - name: Commit
        run: |
          if git diff --quiet -- datasets; then
            echo "Nothing changed in datasets/"
          else
            git config user.name "BetterBARMM updates"
            git config user.email "support@betterbarmm.com"
            git add datasets
            git commit -m "data: publish approved updates"
            git push
          fi
      # Only once the commit is pushed, so a failed push leaves them approved
      # for the next run to try again.
      - run: bun db:publish --mark
